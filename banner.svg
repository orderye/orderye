<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 550" role="img" aria-label="neofetch — toroy@mbp, CRT phosphor terminal">
  <title>neofetch — toroy@mbp</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="scr" gradientUnits="userSpaceOnUse" cx="408" cy="278" r="475">
      <stop offset="0" stop-color="#0a1709"/>
      <stop offset="0.55" stop-color="#071207"/>
      <stop offset="1" stop-color="#020602"/>
    </radialGradient>
    <radialGradient id="phos" gradientUnits="userSpaceOnUse" cx="408" cy="278" r="310">
      <stop offset="0" stop-color="#00ff50" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00ff50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="408" cy="278" r="540"
        gradientTransform="translate(408 278) scale(1 0.63) translate(-408 -278)">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="wrapvig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#001400" stop-opacity="0"/>
      <stop offset="1" stop-color="#001400" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.18"/>
    </pattern>
    <clipPath id="scrclip"><rect x="28" y="28" width="760" height="500" rx="12"/></clipPath>
    <filter id="glowtext" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowimg" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="edgeblur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="816" height="550" fill="#0b0b0b"/>
  <rect width="816" height="550" rx="26" fill="#111111"/>
  <rect x="6" y="6" width="804" height="538" rx="21" fill="#2a2a2a"/>
  <rect x="8" y="8" width="800" height="534" rx="20" fill="url(#bezel)"/>

  <g clip-path="url(#scrclip)">
    <g>
      <animate attributeName="opacity" values="1;1;0.97;1;1;0.98;1;1"
               keyTimes="0;0.48;0.49;0.5;0.72;0.73;0.74;1" dur="6s" repeatCount="indefinite"/>
      <rect x="28" y="28" width="760" height="500" fill="url(#scr)"/>
      <rect x="28" y="28" width="760" height="500" fill="url(#phos)"/>
      <rect x="28" y="28" width="760" height="500" fill="none" stroke="#000000" stroke-width="120" opacity="0.42" filter="url(#edgeblur)"/>
      <rect x="28" y="28" width="760" height="500" fill="url(#scan)"/>
      <rect x="28" y="28" width="760" height="500" fill="url(#vig)"/>

      <rect x="67.8" y="146" width="280" height="280" rx="4" fill="#0a1a0a"/>
      <rect x="67.8" y="146" width="280" height="280" rx="4" fill="url(#wrapvig)"/>
      <image x="67.8" y="241.6" width="280" height="99.75" filter="url(#glowimg)"
             href="data:image/png;base64,"/>

      <g filter="url(#glowtext)" fill="#33ff33" font-family="SF Mono, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="12">
      <text x="384" y="166.5">When spring doth loose her kites upon the air,</text>
      <text x="384" y="184.5">And summer holds its lotus to the blaze,</text>
      <text x="384" y="202.5">When autumn, true to date, doth loud declare</text>
      <text x="384" y="220.5">Red maples on my roof, in golden days,</text>
      <text x="384" y="242.5">Then winter, with his leaden, weeping sky,</text>
      <text x="384" y="260.5">Doth hurl his snows like fury, wild and free;</text>
      <text x="384" y="278.5">The year hath never once betrayed the eye,</text>
      <text x="384" y="296.5">Nor missed an hour from its old decree.</text>
      <text x="384" y="318.5">Yet I, in some far corner, weep and wail,</text>
      <text x="384" y="336.5">Though seasons, faithful, turn their measured wheel;</text>
      <text x="384" y="354.5">The world doth keep its faith, and will not fail,</text>
      <text x="384" y="372.5">But I am torn, and no solace can heal.</text>
      <text x="384" y="394.5">So let the seasons keep their ancient art,</text>
      <text x="384" y="412.5">I weep, and winter weeps beside my heart.</text>
      </g>

      <g filter="url(#glowtext)" font-family="SF Mono, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="16" xml:space="preserve">
        <text x="68" y="474"><tspan fill="#88ff88">toroy</tspan><tspan fill="#44cc44">@</tspan><tspan fill="#88ff88">mbp</tspan><tspan fill="#33ff33">$ </tspan></text>
        <rect x="184" y="461" width="9" height="16" fill="#33ff33">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.501;1"
                   calcMode="discrete" dur="1.06s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g>
      <rect x="68" y="492" width="26" height="16" fill="#5a1a00"/>
      <rect x="96" y="492" width="26" height="16" fill="#2a6b2a"/>
      <rect x="124" y="492" width="26" height="16" fill="#7a7a00"/>
      <rect x="152" y="492" width="26" height="16" fill="#005a5a"/>
      <rect x="180" y="492" width="26" height="16" fill="#5a0000"/>
      <rect x="208" y="492" width="26" height="16" fill="#003a00"/>
      <rect x="236" y="492" width="26" height="16" fill="#1a1a1a"/>
      <rect x="264" y="492" width="26" height="16" fill="#88ff88"/>
      </g>
    </g>
  </g>

  <g filter="url(#glowtext)">
    <circle cx="793" cy="539" r="3" fill="#33ff33"/>
  </g>
</svg>
